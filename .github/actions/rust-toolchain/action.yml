name: Pinned Rust toolchain
description: >
  Install the toolchain pinned by rust-toolchain.toml into the runner home,
  reusing rustup when it is already there. Build output stays on local disk.
  This step does not upload an Actions cache and does not change the Go toolchain.

runs:
  using: composite
  steps:
    - name: Tools the pinned toolchain needs
      shell: bash
      run: |
        set -euo pipefail
        # A cancelled job can leave an evidence container. Remove exited ones
        # named by this repository. Leave other repositories' containers alone.
        if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
          ids="$(docker ps -aq --filter "name=segment-log-" --filter "status=exited" || true)"
          if [ -n "$ids" ]; then
            # shellcheck disable=SC2086
            docker rm -f $ids || true
          fi
        fi
        if [ "$(uname -s)" = Linux ]; then
          "$GITHUB_WORKSPACE/scripts/ci-ensure-commands.sh" curl:curl cc:build-essential python3:python3
        fi
    - name: Install the pinned toolchain into the runner home
      shell: bash
      run: |
        set -euo pipefail
        echo "runner=${RUNNER_NAME:-unknown} os=$(uname -s) $(uname -m)"
        if command -v rustup >/dev/null 2>&1; then
          :
        elif [ -x "${HOME}/.cargo/bin/rustup" ]; then
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.cargo/bin:${PATH}"
        else
          # --no-modify-path keeps the runner user's shell profile, including Go on PATH.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.cargo/bin:${PATH}"
        fi
        # No argument: install the toolchain and components named by rust-toolchain.toml.
        rustup toolchain install
        rustup show
        # Local disk, not actions/cache. A later step can override the target directory.
        target="${HOME}/.cache/segment-log/target"
        mkdir -p "$target"
        if [ "$(uname -s)" = Linux ]; then
          bytes="$(du -sb "$target" | awk '{print $1}')"
          # One shared disk. Drop this repository's incremental output past 8 GiB.
          # The cargo registry in the home directory stays.
          if [ "$bytes" -gt 8589934592 ]; then
            rm -rf "$target"
            mkdir -p "$target"
          fi
        fi
        echo "CARGO_TARGET_DIR=${target}" >> "$GITHUB_ENV"
        # Scratch files die with the job, including on a persistent runner.
        echo "TMPDIR=${RUNNER_TEMP}" >> "$GITHUB_ENV"
