name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new commit on a pull request or a branch push replaces the run still in progress.
# A release does not.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest warns until 2026-11-19 while GitHub moves that label to 26.04.
        # Pin 26.04 so this job does not float with that label.
        # https://github.com/actions/runner-images/issues/14748
        os: [ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # With no argument, rustup installs the version pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Rerun every scenario across rolls: 65 bytes rolls after each group, 256 after a few.
      - run: cargo test --workspace
        env:
          SEGMENT_LOG_TEST_ROLL_BYTES: 65
      - run: cargo test --workspace
        env:
          SEGMENT_LOG_TEST_ROLL_BYTES: 256
      - run: python3 -m unittest discover -s scripts -p 'test_m*.py'

  # The shared conformance cases over the Unix socket, run by the Go test client (ADR 0058).
  conformance:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Same pin as check: ubuntu-latest warns until 2026-11-19.
        os: [ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo build -p segment-log-server
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/go/go.mod
          cache: false
      - working-directory: clients/go
        run: test -z "$(gofmt -l .)"
      - working-directory: clients/go
        run: go vet ./...
      - working-directory: clients/go
        run: go test -count=1 -v ./...
        env:
          SEGMENT_LOG_SERVER: ${{ github.workspace }}/target/debug/segment-log-server
