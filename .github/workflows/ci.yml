name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest warns until 2026-11-19 while GitHub moves that label to 26.04.
        # Pin 24.04 so the job stays on the image that is already green.
        # https://github.com/actions/runner-images/issues/14748
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # With no argument, rustup installs the version pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Rerun every scenario across rolls: 65 bytes rolls after each group, 256 after a few.
      - run: cargo test --workspace
        env:
          SEGMENT_LOG_TEST_ROLL_BYTES: 65
      - run: cargo test --workspace
        env:
          SEGMENT_LOG_TEST_ROLL_BYTES: 256
      - run: python3 -m unittest discover -s scripts -p 'test_m1_*.py'
