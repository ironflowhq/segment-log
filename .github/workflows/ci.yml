name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new commit on a pull request or a branch push replaces the run still in progress.
# A release does not.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest warns until 2026-11-19 while GitHub moves that label to 26.04.
        # Pin 26.04 so this job does not float with that label.
        # https://github.com/actions/runner-images/issues/14748
        os: [ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # With no argument, rustup installs the version pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Rerun every scenario across rolls: 65 bytes rolls after each group, 256 after a few.
      - run: cargo test --workspace
        env:
          SEGMENT_LOG_TEST_ROLL_BYTES: 65
      - run: cargo test --workspace
        env:
          SEGMENT_LOG_TEST_ROLL_BYTES: 256
      - run: python3 -m unittest discover -s scripts -p 'test_m*.py'

  # The workspace builds and passes its tests at the declared rust-version (ADR 0064, rule 16).
  msrv:
    timeout-minutes: 30
    # Same pin as check: ubuntu-latest warns until 2026-11-19.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      # `+toolchain` overrides rust-toolchain.toml.
      - run: cargo +${{ steps.msrv.outputs.version }} test --workspace

  # Public API changes against the last release tag (ADR 0064, rule 15): a patch release never
  # breaks the API. Before the first tag there is no baseline, and the job says so and passes.
  semver:
    timeout-minutes: 30
    # Same pin as check: ubuntu-latest warns until 2026-11-19.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: baseline
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - if: steps.baseline.outputs.tag == ''
        run: echo "::notice::No release tag yet; cargo-semver-checks runs once v0.1.0 exists."
      - if: steps.baseline.outputs.tag != ''
        run: rustup toolchain install
      - if: steps.baseline.outputs.tag != ''
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-rev: ${{ steps.baseline.outputs.tag }}
          rust-toolchain: manual

  # The shared conformance cases over the Unix socket, run by the Go test client (ADR 0058).
  conformance:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Same pin as check: ubuntu-latest warns until 2026-11-19.
        os: [ubuntu-26.04, macos-latest]
        transport: [unix]
        include:
          # The same cases over the vsock host loopback (ADR 0056); Linux only.
          - os: ubuntu-26.04
            transport: vsock
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo build -p segment-log-server
      # No skip if the module is missing: the step fails, and so does the job (ADR 0058).
      - if: matrix.transport == 'vsock'
        run: sudo modprobe vsock_loopback
      - uses: actions/setup-go@v7
        with:
          go-version-file: clients/go/go.mod
          cache: false
      - working-directory: clients/go
        run: test -z "$(gofmt -l .)"
      - working-directory: clients/go
        run: go vet ./...
      - working-directory: clients/go
        run: go test -count=1 -v ./...
        env:
          SEGMENT_LOG_SERVER: ${{ github.workspace }}/target/debug/segment-log-server
          SEGMENT_LOG_TRANSPORT: ${{ matrix.transport }}

  # The M6 footprint targets: stripped release musl binary size and idle resident set (ADR 0056).
  footprint:
    timeout-minutes: 30
    # Same pin as check: ubuntu-latest warns until 2026-11-19.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release -p segment-log-server --target x86_64-unknown-linux-musl
      - run: scripts/m6-footprint.sh target/x86_64-unknown-linux-musl/release/segment-log-server
