name: CI

on:
  push:
    branches: [main]
  pull_request:

# One Linux runner. A newer push on the same ref replaces a run that has not finished.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux for this repository runs on the Hetzner runner. A fork pull request
          # runs on GitHub-hosted Ubuntu instead: the repository is public, and that
          # runner is persistent and in the docker group. ubuntu-24.04 is the image
          # these jobs already passed on while ubuntu-latest moves to 26.04.
          # macOS stays on GitHub-hosted runners because the correctness gate requires macOS.
          - name: linux
            trusted: '["self-hosted","hetzner"]'
            untrusted: '["ubuntu-24.04"]'
          - name: macos
            trusted: '["macos-latest"]'
            untrusted: '["macos-latest"]'
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && matrix.untrusted || matrix.trusted) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Rerun every scenario across rolls: 65 bytes rolls after each group, 256 after a few.
      - run: cargo test --workspace
        env:
          SEGMENT_LOG_TEST_ROLL_BYTES: 65
      - run: cargo test --workspace
        env:
          SEGMENT_LOG_TEST_ROLL_BYTES: 256
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
