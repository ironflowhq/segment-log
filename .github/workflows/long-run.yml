name: Scheduled long runs
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      drill:
        description: Plant a known-bad oracle record, then fetch and replay the failure artifacts
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  m1-long-run:
    name: M1 long run (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SEGMENT_LOG_TRACE_SEEDS: '100'
      SEGMENT_LOG_TRACE_SEED: '10000'
      SEGMENT_LOG_TRACE_ARTIFACT_DIR: ${{ github.workspace }}/.audit/trace-failures
      SEGMENT_LOG_PROCESS_REPETITIONS: '30'
      SEGMENT_LOG_PROCESS_SEED: '10000'
      SEGMENT_LOG_TRACE_DRILL: ${{ inputs.drill && '1' || '0' }}
      SEGMENT_LOG_PROCESS_DRILL: ${{ inputs.drill && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo test -p segment-log-core --lib acceptance::seeded::threaded_seeded_traces_long_run -- --ignored --exact --nocapture
      # A trace failure must not hide the process result, and a drill needs both artifacts.
      - if: ${{ !cancelled() }}
        run: |
          mkdir -p "$SEGMENT_LOG_TRACE_ARTIFACT_DIR/process"
          TMPDIR="$SEGMENT_LOG_TRACE_ARTIFACT_DIR/process" cargo test -p segment-log-core --test process_crash killed_writers_preserve_the_recorded_contract -- --nocapture
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: trace-failures-${{ matrix.os }}
          path: .audit/trace-failures
          include-hidden-files: true
          if-no-files-found: ignore
  m2-long-run:
    name: M2 long run (${{ matrix.os }})
    if: ${{ !inputs.drill }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SEGMENT_LOG_MODEL_CASES: '20000'
      SEGMENT_LOG_MODEL_SEED: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo test -p segment-log-core --lib acceptance::model::the_log_agrees_with_the_model_long_run -- --ignored --exact --nocapture
      - if: ${{ !cancelled() }}
        run: cargo test -p segment-log-core --lib acceptance::model::erasing_rejected_submits_changes_nothing_long_run -- --ignored --exact --nocapture
      # proptest adds the seed of a failed case to this directory.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: model-regressions-${{ matrix.os }}
          path: segment-log-core/proptest-regressions
          if-no-files-found: ignore
  drill-replay:
    # No matrix expression here: a skipped job would show it unexpanded. The matrix value is appended.
    name: Drill replay
    if: ${{ always() && inputs.drill }}
    needs: m1-long-run
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: The planted record failed the long run
        run: test "${{ needs.m1-long-run.result }}" = failure
      - uses: actions/download-artifact@v4
        with:
          name: trace-failures-${{ matrix.os }}
          path: .audit/drill
      - run: scripts/m1-drill-replay.sh .audit/drill
