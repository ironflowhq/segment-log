name: M1 evidence capture
# Captures the M1 completion evidence: the checks, the Linux syscall trace, both
# directory-sync results and the Linux benchmark. Dispatch it, or put the `m1-evidence`
# label on a pull request to capture that pull request's head. Linux for this repository
# runs on the Hetzner runner. A fork pull request uses GitHub-hosted Ubuntu. macOS stays
# on a GitHub-hosted runner because that capture has to run on macOS.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  linux:
    name: Linux capture
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'm1-evidence' }}
    timeout-minutes: 60
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-24.04"]' || '["self-hosted","hetzner"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/rust-toolchain
      # Segment files go to the job temp directory. The runner deletes it. The upload is the capture.
      - run: bash scripts/m1-evidence-guest.sh
        env:
          M1_OUT: ${{ runner.temp }}/m1-evidence
          CARGO_TARGET_DIR: ${{ runner.temp }}/m1-build
          SEGMENT_LOG_EVIDENCE_DIR: ${{ runner.temp }}/segment-log-data
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: m1-evidence-linux
          path: ${{ runner.temp }}/m1-evidence
          retention-days: 3
          compression-level: 9
      - if: always()
        run: rm -rf "${{ runner.temp }}/segment-log-data"
  macos:
    name: macOS capture
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'm1-evidence' }}
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/rust-toolchain
      - run: scripts/m1-evidence-macos.sh "$RUNNER_TEMP/m1-evidence"
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/m1-build
          SEGMENT_LOG_EVIDENCE_DIR: ${{ runner.temp }}/m1-data
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: m1-evidence-macos
          path: ${{ runner.temp }}/m1-evidence
          retention-days: 3
          compression-level: 9
