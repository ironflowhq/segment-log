name: M3 evidence capture
# Captures the M3 roll evidence on Linux: the syscall trace of a roll and the verifier's
# result (ADR 0029). Dispatch it, or put the `m3-evidence` label on a pull request to
# capture that pull request's head. This repository's Linux runs use the Hetzner runner.
# A fork pull request uses GitHub-hosted Ubuntu so fork code does not run on that machine.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  linux:
    name: Linux roll syscall capture
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'm3-evidence' }}
    timeout-minutes: 30
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-24.04"]' || '["self-hosted","hetzner"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/rust-toolchain
      - run: scripts/ci-ensure-commands.sh strace:strace
      - run: scripts/m3-evidence.sh "$RUNNER_TEMP/m3-evidence"
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/m3-build
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: m3-evidence-linux
          path: ${{ runner.temp }}/m3-evidence
          retention-days: 3
          compression-level: 9
