name: M1 latency comparison
# Measures the append benchmark of two commits on one Linux machine, in alternating pairs.
# Dispatch it with a base, or put the `m1-compare` label on a pull request to compare its base
# with its head. This repository's Linux runs use the Hetzner runner. A fork pull request uses
# GitHub-hosted Ubuntu so fork code does not run on that persistent machine.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Commit or ref to measure as "before"
        required: true
      head:
        description: Commit or ref to measure as "after" (default is the dispatched ref)
        required: false
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  compare:
    name: Compare base and head
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'm1-compare' }}
    timeout-minutes: 60
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-24.04"]' || '["self-hosted","hetzner"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/rust-toolchain
      - run: scripts/ci-ensure-commands.sh /usr/bin/time:time
      # Segment files go to the job temp directory. The runner deletes it. The upload is the logs.
      - run: scripts/m1-compare-refs.sh "$BASE" "$HEAD" "$RUNNER_TEMP/m1-compare"
        env:
          BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
          HEAD: ${{ inputs.head || github.event.pull_request.head.sha || github.sha }}
          SEGMENT_LOG_EVIDENCE_DIR: ${{ runner.temp }}/segment-log-data
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: m1-compare
          path: ${{ runner.temp }}/m1-compare
          retention-days: 3
          compression-level: 9
      - if: always()
        run: rm -rf "${{ runner.temp }}/segment-log-data"
