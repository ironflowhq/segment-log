<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280" role="img" aria-label="Separate resident and requested heap measurements for histories without keys and with 16,384 keys"><rect width="820" height="280" fill="white"/><g font-family="sans-serif" fill="#152536"><text x="24" y="28" font-size="19">Keyed-history comparison, five trials per side</text><text x="24" y="60" font-size="13">Held process RSS delta, MiB</text><text x="24" y="114" font-size="12">No keys</text><rect x="116" y="95" width="29.25" height="28" fill="#547b9a"/><path d="M145.25,109H146.88 M145.25,104v10 M146.88,104v10" stroke="#14212a"/><text x="153.25" y="115" font-size="12">0.562</text><text x="24" y="178" font-size="12">16,384 keys</text><rect x="116" y="159" width="221.00" height="28" fill="#166c5b"/><path d="M335.38,173H337.81 M335.38,168v10 M337.81,168v10" stroke="#14212a"/><text x="345.00" y="179" font-size="12">4.250</text><text x="24" y="218" font-size="11">Bars are medians. Whiskers show full observed ranges.</text><text x="425" y="60" font-size="13">Requested heap released by Drop, MiB</text><text x="425" y="114" font-size="12">No keys</text><rect x="517" y="95" width="13.25" height="28" fill="#547b9a"/><path d="M530.25,109H530.25 M530.25,104v10 M530.25,104v10" stroke="#14212a"/><text x="538.25" y="115" font-size="12">0.255</text><text x="425" y="178" font-size="12">16,384 keys</text><rect x="517" y="159" width="159.03" height="28" fill="#166c5b"/><path d="M676.03,173H676.03 M676.03,168v10 M676.03,168v10" stroke="#14212a"/><text x="684.03" y="179" font-size="12">3.058</text><text x="425" y="218" font-size="11">Bars are medians. Whiskers show full observed ranges.</text><text x="24" y="254" font-size="12">Separate process experiments. RSS includes allocator and runtime residue; neither panel gives exact resident ownership.</text></g></svg>