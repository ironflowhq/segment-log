<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" role="img" aria-labelledby="title desc">
  <title id="title">Two ways in, one writer</title>
  <desc id="desc">A Rust program links segment-log-core and calls append directly. A Go program, or one in any other language, sends requests over a Unix socket, or over vsock from a guest, to segment-log-server, which runs one process per log and the same core inside it. Both ways lead to the core's accept queue. The core's single writer thread packs appends into a group and one fsync makes the group durable in the segment files. The files sit on a volume that outlives the guest, and after the guest exits LogReader reads the sealed history.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .t { font-size: 20px; font-weight: 600; }
    .s { font-size: 14px; }
    .m { font-size: 13px; fill: #59636e; }
    .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .bg { fill: #ffffff; }
    .card { fill: #f6f8fa; stroke: #afb8c1; }
    .core { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.5; }
    .node { fill: #ffffff; stroke: #afb8c1; }
    .line { fill: none; stroke: #6e7781; stroke-width: 1.5; }
    .head { fill: #6e7781; }
    .sync { fill: none; stroke: #0969da; stroke-width: 1.5; }
    .synchead { fill: #0969da; }
    .good { fill: #0969da; font-size: 14px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #545d68; }
      .core { fill: #161b22; stroke: #4493f8; }
      .node { fill: #0d1117; stroke: #545d68; }
      .line { stroke: #7d8590; }
      .head { fill: #7d8590; }
      .sync { stroke: #4493f8; }
      .synchead { fill: #4493f8; }
      .good { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="head" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="synchead" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs>

  <rect class="bg" width="960" height="436" rx="14"/>
  <text class="t" x="40" y="46">Two ways in, one writer</text>
  <text class="m" x="40" y="70">Rust links the library. Other languages talk to the server, which runs the same library.</text>

  <!-- Callers -->
  <rect class="card" x="40" y="106" width="156" height="60" rx="8"/>
  <text class="s" x="56" y="131">your Rust code</text>
  <text class="m" x="56" y="151">links the library</text>
  <rect class="card" x="40" y="236" width="156" height="60" rx="8"/>
  <text class="s" x="56" y="261">your Go code</text>
  <text class="m" x="56" y="281">or any language</text>

  <!-- Embedded path -->
  <path class="line" d="M198,136 H558 Q566,136 566,144 V193 Q566,201 574,201 H587" marker-end="url(#ah)"/>
  <text class="m" x="381" y="127" text-anchor="middle"><tspan class="code">append()</tspan>, in the same process</text>

  <!-- Server path -->
  <path class="line" d="M198,266 H363" marker-end="url(#ah)"/>
  <text class="m" x="281" y="257" text-anchor="middle">Unix socket</text>
  <text class="m" x="281" y="284" text-anchor="middle">or vsock from a guest</text>
  <rect class="card" x="366" y="218" width="176" height="96" rx="8"/>
  <text class="code" x="382" y="244">segment-log-server</text>
  <text class="m" x="382" y="266">one process per log</text>
  <text class="m" x="382" y="284">a reader and a writer</text>
  <text class="m" x="382" y="302">thread per connection</text>
  <path class="line" d="M544,266 H558 Q566,266 566,258 V209 Q566,201 574,201"/>

  <!-- Core -->
  <rect class="core" x="590" y="106" width="164" height="244" rx="8"/>
  <text class="code" x="606" y="132">segment-log-core</text>
  <text class="m" x="606" y="152">in your process, or</text>
  <text class="m" x="606" y="169">in the server's</text>
  <rect class="node" x="606" y="184" width="132" height="34" rx="6"/>
  <text class="s" x="672" y="206" text-anchor="middle">accept queue</text>
  <path class="line" d="M672,220 V241" marker-end="url(#ah)"/>
  <rect class="node" x="606" y="244" width="132" height="34" rx="6"/>
  <text class="s" x="672" y="266" text-anchor="middle">writer thread</text>
  <text class="m" x="606" y="300">packs appends into</text>
  <text class="m" x="606" y="318">one group, then</text>
  <text class="good" x="606" y="336">one fsync</text>

  <!-- Segment files and reader -->
  <path class="sync" d="M756,261 H785" marker-end="url(#ahb)"/>
  <rect class="card" x="788" y="214" width="132" height="94" rx="8"/>
  <text class="s" x="804" y="240">segment files</text>
  <text class="m" x="804" y="260">on a volume</text>
  <text class="m" x="804" y="277">that outlives</text>
  <text class="m" x="804" y="294">the guest</text>
  <path class="line" d="M854,310 V333" marker-end="url(#ah)"/>
  <rect class="card" x="788" y="336" width="132" height="52" rx="8"/>
  <text class="code" x="804" y="358">LogReader</text>
  <text class="m" x="804" y="376">after the guest</text>

  <text class="s" x="40" y="380">Both ways get the same guarantee: an ack means the group is on disk.</text>
  <text class="m" x="40" y="404">Over the socket, a connection lost before its answer means the outcome is unknown: retry with the same key.</text>
</svg>
