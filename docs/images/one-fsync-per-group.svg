<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" role="img" aria-labelledby="title desc">
  <title id="title">One fsync per agent, compared with one fsync per group</title>
  <desc id="desc">Left, without segment-log: five agents each write their own file, and the disk does one flush per agent, one after another. Right, with segment-log: the same agents put their appends in the accept queue, the writer thread packs them into one group, and the disk does one flush for the whole group. Acks go back to the agents only after that fsync returns.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .t { font-size: 20px; font-weight: 600; }
    .h { font-size: 16px; font-weight: 600; }
    .s { font-size: 14px; }
    .n { font-size: 13px; }
    .m { font-size: 13px; fill: #59636e; }
    .bg { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .node { fill: #ffffff; stroke: #afb8c1; }
    .line { fill: none; stroke: #6e7781; stroke-width: 1.5; }
    .head { fill: #6e7781; }
    .dot { fill: #8c959f; }
    .bad { fill: #bc4c00; }
    .good { fill: #0969da; }
    .soft { fill: #ddf4ff; stroke: #80ccff; }
    .group { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .cut { fill: none; stroke: #0969da; }
    .ack { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .ackhead { fill: #0969da; }
    .count { font-size: 14px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .node { fill: #0d1117; stroke: #545d68; }
      .line { stroke: #7d8590; }
      .head { fill: #7d8590; }
      .dot { fill: #6e7681; }
      .bad { fill: #f0883e; }
      .good { fill: #4493f8; }
      .soft { fill: #1f2a44; stroke: #2e4a7d; }
      .group { fill: #1f2a44; stroke: #4493f8; }
      .cut { stroke: #4493f8; }
      .ack { stroke: #4493f8; }
      .ackhead { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="head" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="ackhead" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs>

  <rect class="bg" width="960" height="528" rx="14"/>
  <text class="t" x="40" y="46">One fsync per group</text>
  <text class="m" x="40" y="70">The same agents and the same disk, without segment-log and with it.</text>

  <!-- Without segment-log: agent, own file, own flush -->
  <rect class="panel" x="40" y="92" width="430" height="404" rx="12"/>
  <text class="h" x="60" y="122">Without segment-log</text>
  <text class="m" x="60" y="144">Every agent flushes its own file.</text>

  <g>
    <rect class="node" x="60" y="194" width="80" height="26" rx="6"/><text class="s" x="100" y="212" text-anchor="middle">agent 1</text>
    <rect class="node" x="60" y="228" width="80" height="26" rx="6"/><text class="s" x="100" y="246" text-anchor="middle">agent 2</text>
    <rect class="node" x="60" y="262" width="80" height="26" rx="6"/><text class="s" x="100" y="280" text-anchor="middle">agent 3</text>
    <rect class="node" x="60" y="296" width="80" height="26" rx="6"/><text class="s" x="100" y="314" text-anchor="middle">agent 4</text>
    <rect class="node" x="60" y="348" width="80" height="26" rx="6"/><text class="s" x="100" y="366" text-anchor="middle">agent N</text>
  </g>
  <g>
    <rect class="node" x="229" y="194" width="60" height="26" rx="6"/><text class="s" x="259" y="212" text-anchor="middle">file 1</text>
    <rect class="node" x="229" y="228" width="60" height="26" rx="6"/><text class="s" x="259" y="246" text-anchor="middle">file 2</text>
    <rect class="node" x="229" y="262" width="60" height="26" rx="6"/><text class="s" x="259" y="280" text-anchor="middle">file 3</text>
    <rect class="node" x="229" y="296" width="60" height="26" rx="6"/><text class="s" x="259" y="314" text-anchor="middle">file 4</text>
    <rect class="node" x="229" y="348" width="60" height="26" rx="6"/><text class="s" x="259" y="366" text-anchor="middle">file N</text>
  </g>
  <g class="line" marker-end="url(#ah)">
    <path d="M142,207 H226"/><path d="M291,207 H375"/>
    <path d="M142,241 H226"/><path d="M291,241 H375"/>
    <path d="M142,275 H226"/><path d="M291,275 H375"/>
    <path d="M142,309 H226"/><path d="M291,309 H375"/>
    <path d="M142,361 H226"/><path d="M291,361 H375"/>
  </g>

  <text class="m" x="414" y="176" text-anchor="middle">disk</text>
  <rect class="node" x="378" y="186" width="72" height="196" rx="8"/>
  <g class="bad">
    <rect x="392" y="202" width="44" height="10" rx="2"/>
    <rect x="392" y="236" width="44" height="10" rx="2"/>
    <rect x="392" y="270" width="44" height="10" rx="2"/>
    <rect x="392" y="304" width="44" height="10" rx="2"/>
    <rect x="392" y="356" width="44" height="10" rx="2"/>
  </g>
  <text class="count bad" x="414" y="404" text-anchor="middle">N flushes</text>

  <g class="dot">
    <circle cx="100" cy="329" r="1.5"/><circle cx="100" cy="335" r="1.5"/><circle cx="100" cy="341" r="1.5"/>
    <circle cx="259" cy="329" r="1.5"/><circle cx="259" cy="335" r="1.5"/><circle cx="259" cy="341" r="1.5"/>
    <circle cx="414" cy="329" r="1.5"/><circle cx="414" cy="335" r="1.5"/><circle cx="414" cy="341" r="1.5"/>
  </g>

  <text class="n" x="60" y="458">One flush per agent, one after another.</text>
  <text class="n" x="60" y="476">The disk's flush rate caps how many agents can run.</text>

  <!-- With segment-log: accept queue, one group, one flush -->
  <rect class="panel" x="490" y="92" width="430" height="404" rx="12"/>
  <text class="h" x="510" y="122">With segment-log</text>
  <text class="m" x="510" y="144">One writer thread packs many appends into one group.</text>

  <g>
    <rect class="node" x="510" y="194" width="80" height="26" rx="6"/><text class="s" x="550" y="212" text-anchor="middle">agent 1</text>
    <rect class="node" x="510" y="228" width="80" height="26" rx="6"/><text class="s" x="550" y="246" text-anchor="middle">agent 2</text>
    <rect class="node" x="510" y="262" width="80" height="26" rx="6"/><text class="s" x="550" y="280" text-anchor="middle">agent 3</text>
    <rect class="node" x="510" y="296" width="80" height="26" rx="6"/><text class="s" x="550" y="314" text-anchor="middle">agent 4</text>
    <rect class="node" x="510" y="348" width="80" height="26" rx="6"/><text class="s" x="550" y="366" text-anchor="middle">agent N</text>
  </g>
  <g class="line" marker-end="url(#ah)">
    <path d="M592,207 H617"/>
    <path d="M592,241 H617"/>
    <path d="M592,275 H617"/>
    <path d="M592,309 H617"/>
    <path d="M592,361 H617"/>
    <path d="M682,284 H709"/>
    <path d="M798,284 H825"/>
  </g>

  <text class="m" x="650" y="176" text-anchor="middle">accept queue</text>
  <rect class="node" x="620" y="186" width="60" height="196" rx="8"/>
  <g class="soft">
    <rect x="630" y="200" width="40" height="14" rx="3"/>
    <rect x="630" y="234" width="40" height="14" rx="3"/>
    <rect x="630" y="268" width="40" height="14" rx="3"/>
    <rect x="630" y="302" width="40" height="14" rx="3"/>
    <rect x="630" y="354" width="40" height="14" rx="3"/>
  </g>

  <text class="m" x="754" y="176" text-anchor="middle">writer thread</text>
  <rect class="node" x="712" y="186" width="84" height="196" rx="8"/>
  <rect class="group" x="732" y="249" width="44" height="70" rx="3"/>
  <path class="cut" d="M732,263 H776 M732,277 H776 M732,291 H776 M732,305 H776"/>
  <text class="m" x="754" y="340" text-anchor="middle">one group</text>

  <text class="m" x="864" y="176" text-anchor="middle">disk</text>
  <rect class="node" x="828" y="186" width="72" height="196" rx="8"/>
  <rect class="good" x="842" y="279" width="44" height="10" rx="2"/>
  <text class="count good" x="864" y="404" text-anchor="middle">1 flush</text>

  <g class="dot">
    <circle cx="550" cy="329" r="1.5"/><circle cx="550" cy="335" r="1.5"/><circle cx="550" cy="341" r="1.5"/>
    <circle cx="650" cy="329" r="1.5"/><circle cx="650" cy="335" r="1.5"/><circle cx="650" cy="341" r="1.5"/>
  </g>

  <path class="ack" d="M754,382 V400 Q754,408 746,408 H558 Q550,408 550,400 V377" marker-end="url(#ahb)"/>
  <text class="m" x="566" y="427">acks go out after the fsync returns</text>

  <text class="n" x="510" y="458">Many agents share each flush.</text>
  <text class="n" x="510" y="476">An ack means the group is on disk.</text>
</svg>
