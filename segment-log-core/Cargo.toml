[package]
name = "segment-log-core"
description = "Embedded append-only segment log for Ironflow (pre-release; format provisional until M5)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

# The owner probe gives the engine its own allocator arena.
[dev-dependencies]
libc = "0.2"
# An exact version, because a saved regression seed gives the same case only under the same generator.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
talc = { version = "=5.1.1", default-features = false }
