[package]
name = "segment-log-core"
description = "Embedded append-only segment log for Ironflow (pre-release; on-disk format may change until the first production release)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
# Test-only: open's rewrite of the recovered tail writes one changed byte, the known-bad control of
# VOL-POWER-CUT-RECOVERY (volume-requirements.md, V2). Never in a release build.
rewrite-control = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

# The owner probe gives the engine its own allocator arena.
[dev-dependencies]
libc = "0.2"
# An exact version, because a saved regression seed gives the same case only under the same generator.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
talc = { version = "=5.1.1", default-features = false }
